<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Probeschild</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center;
      background: #20304a; color: #f4ecd8;
      font: 18px system-ui, sans-serif; text-align: center;
    }
    button { font: inherit; padding: .6em 1.2em; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>🧪 Probeschild</h1>
    <p>Klicks: <strong id="klicks">0</strong></p>
    <button id="knopf">Klick!</button>
    <p><small>Jeder Klick wird als Bestleistung an die Wiese gemeldet.</small></p>
  </div>
  <script>
    let klicks = 0;
    document.getElementById('knopf').addEventListener('click', () => {
      klicks++;
      document.getElementById('klicks').textContent = klicks;
      window.parent.postMessage({ typ: 'spielwiese:ergebnis', wert: klicks, text: `${klicks} Klicks` }, '*');
    });
  </script>
</body>
</html>
