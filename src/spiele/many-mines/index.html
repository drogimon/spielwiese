<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Many Mines</title>
<style>
  :root {
    --text: #f3e9ff;
    --muted: #c3b0ef;
    --cyan: #2ee6ff;
    --pink: #ff3fd0;
    --hidden: #3a1a6a;
    --hidden-hover: #4d2490;
    --open: #160a2e;
    --mine-bg: #ff2a6d;
    --wrong: #5c1640;
    --horizont: 62%;
  }
  * { box-sizing: border-box; }
  html { background: #0b0221; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- Hintergrund: Nachthimmel, Retro-Sonne, Berge, Neon-Gitter ---------- */
  .szene {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 27% 8%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 41% 30%, #ffd9f7 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 73% 24%, #d9f7ff 50%, transparent 51%),
      radial-gradient(1px 1px at 86% 9%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 93% 34%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 5% 40%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 34% 46%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 66% 44%, #fff 50%, transparent 51%),
      linear-gradient(to bottom, #0b0221 0%, #1d0640 35%, #4a0d62 var(--horizont), #12021f var(--horizont));
  }
  .sonne {
    position: absolute; left: 50%;
    width: min(64vh, 540px); aspect-ratio: 1;
    top: calc(var(--horizont) - min(64vh, 540px) * .62);
    clip-path: inset(0 0 38% 0); /* endet am Horizont */
    translate: -50% 0;
    border-radius: 50%;
    background: linear-gradient(to bottom, #ffef7a 0%, #ffb340 35%, #ff4f8b 65%, #c21aa8 100%);
    /* obere Hälfte voll, untere Hälfte in Streifen */
    -webkit-mask-image: linear-gradient(#000 52%, transparent 52%), repeating-linear-gradient(to bottom, #000 0 14px, transparent 14px 21px);
    mask-image: linear-gradient(#000 52%, transparent 52%), repeating-linear-gradient(to bottom, #000 0 14px, transparent 14px 21px);
    filter: drop-shadow(0 0 30px rgba(255, 79, 139, .55));
  }
  .berge {
    position: absolute; left: 0; right: 0;
    top: calc(var(--horizont) - 13vh); height: 13vh;
    background: linear-gradient(to bottom, #3b0f5c, #1a0530);
    clip-path: polygon(0 100%, 0 55%, 7% 30%, 14% 62%, 22% 18%, 31% 70%, 38% 48%, 44% 100%, 56% 100%, 62% 52%, 69% 74%, 77% 22%, 85% 60%, 92% 34%, 100% 58%, 100% 100%);
  }
  .gitter {
    position: absolute; left: -60%; right: -60%;
    top: var(--horizont); height: 70%;
    background-color: #12021f;
    background-image:
      linear-gradient(to bottom, var(--pink) 2px, transparent 2px),
      linear-gradient(to right, var(--pink) 2px, transparent 2px);
    background-size: 70px 70px;
    transform-origin: 50% 0;
    transform: perspective(240px) rotateX(62deg);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
    animation: fahren 1.4s linear infinite;
  }
  .szene::after {
    content: ''; position: absolute; left: 0; right: 0;
    top: calc(var(--horizont) - 1px); height: 2px;
    background: var(--cyan);
    box-shadow: 0 0 12px 2px var(--cyan), 0 0 40px 6px rgba(255, 63, 208, .5);
  }
  @keyframes fahren { to { background-position: 0 70px; } }

  /* ---------- Oberfläche ---------- */
  h1 {
    margin: 0 0 4px; font-size: 40px; font-weight: 900; font-style: italic; letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(to bottom, #e9fdff 0%, #7ff0ff 46%, #ff5fd8 54%, #ffc46b 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 63, 208, .65)) drop-shadow(0 2px 0 #2a0640);
  }
  .subtitle { margin: 0 0 20px; font-size: 14px; color: var(--muted); letter-spacing: .5px; text-shadow: 0 1px 4px #0b0221; }
  .controls {
    display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px;
    background: rgba(16, 4, 36, .7); border: 1px solid rgba(46, 230, 255, .35);
    padding: 4px; border-radius: 8px;
  }
  button.level {
    background: transparent; color: var(--text); border: none; opacity: .75;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
    transition: background .15s, opacity .15s, box-shadow .15s;
  }
  button.level:hover { opacity: 1; background: rgba(255, 63, 208, .15); }
  button.level.active {
    opacity: 1; color: #fff; font-weight: 700;
    background: linear-gradient(90deg, #ff3fd0, #8a3bff);
    box-shadow: 0 0 14px rgba(255, 63, 208, .6);
  }
  .card {
    background: rgba(16, 4, 36, .82);
    border: 1px solid rgba(46, 230, 255, .55);
    border-radius: 10px; padding: 14px;
    box-shadow: 0 0 22px rgba(46, 230, 255, .35), 0 0 60px rgba(255, 63, 208, .2), 0 20px 50px rgba(0,0,0,.6);
    max-width: 100%;
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    margin-bottom: 12px;
  }
  .bar .counter {
    display: flex; align-items: baseline; gap: 8px;
    min-width: 96px; padding: 6px 12px; border-radius: 6px;
    background: rgba(46, 230, 255, .07); border: 1px solid rgba(46, 230, 255, .3);
    font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700;
    color: #bdf6ff; text-shadow: 0 0 8px rgba(46, 230, 255, .6);
  }
  .bar .counter:last-child { justify-content: flex-end; }
  .bar .counter .label { font-size: 12px; font-weight: 600; color: var(--muted); text-shadow: none; }
  #restart {
    display: grid; place-items: center;
    width: 48px; height: 48px; padding: 0; cursor: pointer; color: var(--cyan);
    background: rgba(46, 230, 255, .08); border: 1px solid var(--cyan);
    border-radius: 8px; box-shadow: 0 0 12px rgba(46, 230, 255, .45), inset 0 0 10px rgba(46, 230, 255, .2);
    transition: transform .08s, box-shadow .15s;
  }
  #restart svg { width: 26px; height: 26px; transition: transform .3s; filter: drop-shadow(0 0 4px var(--cyan)); }
  #restart:hover { box-shadow: 0 0 20px rgba(46, 230, 255, .75), inset 0 0 12px rgba(46, 230, 255, .3); }
  #restart:hover svg { transform: rotate(40deg); }
  #restart:active { transform: translateY(2px); }
  .wrap { max-width: 100%; overflow-x: auto; }
  #board {
    display: grid; gap: 2px; background: #07010f; padding: 6px; border-radius: 6px;
    width: max-content; margin: 0 auto;
    box-shadow: inset 0 0 12px rgba(255, 63, 208, .25);
  }
  .cell {
    width: var(--cell, 28px); height: var(--cell, 28px); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(var(--cell, 28px) * .55); border-radius: 3px; cursor: pointer;
    background: linear-gradient(to bottom, #4a2286, var(--hidden));
    box-shadow: inset 0 1px 0 rgba(255, 140, 240, .35);
  }
  .cell.hidden:hover { background: var(--hidden-hover); box-shadow: inset 0 0 0 1px var(--pink); }
  .cell.open { background: var(--open); box-shadow: none; cursor: default; }
  .cell.mine-hit { background: var(--mine-bg); box-shadow: 0 0 12px var(--mine-bg); }
  .cell.wrong { background: var(--wrong); }
  /* Neon-Töne in den üblichen Farbfamilien (1 blau, 2 grün, 3 rot …) */
  .n1 { color: #36c8ff; } .n2 { color: #4dff9a; } .n3 { color: #ff4f7b; } .n4 { color: #a98bff; }
  .n5 { color: #ff8a3d; } .n6 { color: #3ff0d8; } .n7 { color: #f4ecff; } .n8 { color: #9b8fc0; }
  .cell.open[class*=" n"] { text-shadow: 0 0 6px currentColor; }
  #msg { margin-top: 16px; font-size: 18px; font-weight: 700; min-height: 28px; text-align: center; letter-spacing: .5px; }
  #msg.win { color: #4dff9a; text-shadow: 0 0 10px rgba(77, 255, 154, .6); }
  #msg.lose { color: #ff4f9a; text-shadow: 0 0 10px rgba(255, 79, 154, .6); }
  .help {
    margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    max-width: 560px; font-size: 13px;
  }
  .help span {
    background: rgba(16, 4, 36, .75); border: 1px solid rgba(255, 63, 208, .35);
    padding: 5px 10px; border-radius: 999px;
  }
  .help b { color: var(--cyan); font-weight: 600; }
  .custom {
    display: none; gap: 10px; align-items: center; margin-bottom: 16px; font-size: 14px;
    flex-wrap: wrap; justify-content: center;
    background: rgba(16, 4, 36, .75); border: 1px solid rgba(46, 230, 255, .35);
    padding: 8px 12px; border-radius: 8px;
  }
  .custom.show { display: flex; }
  .custom label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .custom input {
    width: 64px; background: #0b0221; color: var(--text); border: 1px solid rgba(255, 63, 208, .45);
    border-radius: 4px; padding: 5px 6px; font-size: 14px;
  }
  .custom input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 8px rgba(46, 230, 255, .5); }
  .custom #customStart { background: linear-gradient(90deg, #ff3fd0, #8a3bff); color: #fff; opacity: 1; font-weight: 700; }
  body.compact { padding-top: 12px; padding-bottom: 12px; }
  body.compact .subtitle, body.compact .help { display: none; }
  body.compact h1 { margin-bottom: 10px; }
  body.compact #msg { margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .gitter { animation: none; }
  }
</style>
</head>
<body>
<div class="szene" aria-hidden="true"><div class="sonne"></div><div class="berge"></div><div class="gitter"></div></div>
<h1>Many Mines</h1>
<p class="subtitle">Finde alle Minen, ohne eine zu treffen.</p>

<div class="controls">
  <button class="level active" data-level="beginner">Ein paar · 9×9</button>
  <button class="level" data-level="intermediate">Viele · 16×16</button>
  <button class="level" data-level="expert">Zu viele · 30×16</button>
  <button class="level" data-level="custom">Eigene</button>
</div>

<div class="custom" id="customPanel">
  <label>Breite <input type="number" id="cw" min="5" max="50" value="20"></label>
  <label>Höhe <input type="number" id="ch" min="5" max="30" value="15"></label>
  <label>Minen <input type="number" id="cm" min="1" value="50"></label>
  <button class="level" id="customStart">Start</button>
</div>

<div class="card">
  <div class="bar">
    <div class="counter"><span class="label">Minen</span><span id="mines">10</span></div>
    <button id="restart" title="Neues Spiel (F2)" aria-label="Neues Spiel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
        <path d="M20 4v5h-5"/>
      </svg>
    </button>
    <div class="counter"><span class="label">Zeit</span><span id="time">0</span></div>
  </div>
  <div class="wrap">
    <div id="board"></div>
  </div>
</div>

<div id="msg"></div>
<div class="help">
  <span><b>Linksklick</b> aufdecken</span>
  <span><b>Rechtsklick</b> Flagge / ?</span>
  <span><b>Klick auf Zahl</b> Umgebung aufdecken</span>
  <span><b>Lange drücken</b> Flagge (Touch)</span>
  <span><b>F2</b> neues Spiel</span>
</div>

<script>
(() => {
  const LEVELS = {
    beginner:     { w: 9,  h: 9,  m: 10, name: 'Ein paar' },
    intermediate: { w: 16, h: 16, m: 40, name: 'Viele' },
    expert:       { w: 30, h: 16, m: 99, name: 'Zu viele' },
  };

  const boardEl   = document.getElementById('board');
  const minesEl   = document.getElementById('mines');
  const timeEl    = document.getElementById('time');
  const restartEl = document.getElementById('restart');
  const msgEl     = document.getElementById('msg');

  let W, H, M;
  let cells;          // Array of {mine, adj, state: 'hidden'|'open'|'flag'|'question', el}
  let started, over, opened, flags;
  let timer = null, seconds = 0;
  let lastTouch = 0;
  let current = LEVELS.beginner;

  const idx = (x, y) => y * W + x;

  function neighbors(i) {
    const x = i % W, y = (i - x) / W, out = [];
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < W && ny >= 0 && ny < H) out.push(idx(nx, ny));
      }
    }
    return out;
  }

  // Feldgröße an das Fenster anpassen: so groß wie die Breite erlaubt, dann verkleinern,
  // bis die Seite ohne senkrechtes Scrollen passt (mindestens 24 px). Reicht das nicht,
  // werden Untertitel und Hilfe ausgeblendet (Kompakt-Modus).
  function fitCells() {
    const availW = Math.min(window.innerWidth, 1400) - 90;
    const start = Math.max(24, Math.min(48, Math.floor(availW / W) - 2));
    const setSize = s => document.documentElement.style.setProperty('--cell', s + 'px');
    const tooHigh = () => document.documentElement.scrollHeight > window.innerHeight;
    for (const compact of [false, true]) {
      document.body.classList.toggle('compact', compact);
      let size = start;
      setSize(size);
      while (size > 24 && tooHigh()) setSize(--size);
      if (!tooHigh()) return;
    }
  }
  window.addEventListener('resize', () => { if (W) fitCells(); });

  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function newGame(cfg = current) {
    current = cfg;
    W = cfg.w; H = cfg.h; M = cfg.m;
    stopTimer();
    seconds = 0; started = false; over = false; opened = 0; flags = 0;
    timeEl.textContent = '0';
    msgEl.textContent = '';
    msgEl.className = '';

    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${W}, var(--cell))`;
    cells = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < W * H; i++) {
      const el = document.createElement('div');
      el.className = 'cell hidden';
      el.dataset.i = i;
      frag.appendChild(el);
      cells.push({ mine: false, adj: 0, state: 'hidden', el });
    }
    boardEl.appendChild(frag);
    fitCells();
    updateMineCounter();
  }

  // Minen werden erst beim ersten Klick gelegt: das angeklickte Feld (und wenn möglich
  // seine Nachbarn) bleibt minenfrei, damit der Start immer eine freie Fläche öffnet.
  function placeMines(safeIndex) {
    const safe = new Set([safeIndex]);
    const nbs = neighbors(safeIndex);
    if (W * H - M >= nbs.length + 1) nbs.forEach(n => safe.add(n));

    const candidates = [];
    for (let i = 0; i < W * H; i++) if (!safe.has(i)) candidates.push(i);
    // Fisher-Yates (teilweise)
    for (let k = 0; k < M; k++) {
      const r = k + Math.floor(Math.random() * (candidates.length - k));
      [candidates[k], candidates[r]] = [candidates[r], candidates[k]];
      cells[candidates[k]].mine = true;
    }
    for (let i = 0; i < W * H; i++) {
      cells[i].adj = neighbors(i).reduce((s, n) => s + (cells[n].mine ? 1 : 0), 0);
    }
  }

  function startTimer() {
    started = true;
    timer = setInterval(() => {
      seconds++;
      timeEl.textContent = seconds;
      if (seconds >= 999) stopTimer();
    }, 1000);
  }

  function updateMineCounter() { minesEl.textContent = M - flags; }

  function renderOpen(c) {
    c.el.className = 'cell open';
    if (c.adj > 0) {
      c.el.textContent = c.adj;
      c.el.classList.add('n' + c.adj);
    } else {
      c.el.textContent = '';
    }
  }

  // Deckt ein Feld auf; leere Felder werden iterativ (ohne Rekursion) ausgebreitet.
  function reveal(i) {
    const c = cells[i];
    if (c.state !== 'hidden' && c.state !== 'question') return;
    if (c.mine) { lose(i); return; }

    const stack = [i];
    while (stack.length) {
      const j = stack.pop();
      const cj = cells[j];
      if (cj.state === 'open' || cj.state === 'flag' || cj.mine) continue;
      cj.state = 'open';
      opened++;
      renderOpen(cj);
      if (cj.adj === 0) {
        for (const n of neighbors(j)) {
          if (cells[n].state === 'hidden' || cells[n].state === 'question') stack.push(n);
        }
      }
    }
    checkWin();
  }

  // Klick auf aufgedeckte Zahl: wenn genug Flaggen drumherum, Rest aufdecken.
  function chord(i) {
    const c = cells[i];
    if (c.state !== 'open' || c.adj === 0) return;
    const nbs = neighbors(i);
    const flagged = nbs.filter(n => cells[n].state === 'flag').length;
    if (flagged !== c.adj) return;
    for (const n of nbs) {
      if (over) return;
      if (cells[n].state === 'hidden' || cells[n].state === 'question') reveal(n);
    }
  }

  function toggleFlag(i) {
    const c = cells[i];
    if (c.state === 'open') return;
    if (c.state === 'hidden') {
      c.state = 'flag'; flags++; c.el.textContent = '🚩';
    } else if (c.state === 'flag') {
      c.state = 'question'; flags--; c.el.textContent = '❓';
    } else {
      c.state = 'hidden'; c.el.textContent = '';
    }
    updateMineCounter();
  }

  function lose(hitIndex) {
    over = true;
    stopTimer();
    msgEl.textContent = 'Boom! Verloren. Klick auf ↻ für ein neues Spiel.';
    msgEl.className = 'lose';
    cells.forEach(c => {
      if (c.mine && c.state !== 'flag') {
        c.el.className = 'cell open';
        c.el.textContent = '💣';
      } else if (!c.mine && c.state === 'flag') {
        c.el.className = 'cell wrong';
        c.el.textContent = '❌';
      }
    });
    cells[hitIndex].el.className = 'cell open mine-hit';
    cells[hitIndex].el.textContent = '💥';
  }

  function checkWin() {
    if (over || opened !== W * H - M) return;
    over = true;
    stopTimer();
    cells.forEach(c => {
      if (c.mine && c.state !== 'flag') { c.state = 'flag'; c.el.textContent = '🚩'; }
    });
    flags = M;
    updateMineCounter();
    msgEl.textContent = `Gewonnen in ${seconds} Sekunde${seconds === 1 ? '' : 'n'}! 🎉`;
    msgEl.className = 'win';
    // Bestzeit an die Spielwiese melden (nur feste Stufen, eigene Felder sind nicht vergleichbar)
    if (current.name && window.parent !== window) {
      window.parent.postMessage({ typ: 'spielwiese:ergebnis', stufe: current.name, wert: seconds, text: `${seconds} s` }, '*');
    }
  }

  function handleOpen(i) {
    if (over) return;
    const c = cells[i];
    if (c.state === 'flag') return;
    if (!started) { placeMines(i); startTimer(); }
    if (c.state === 'open') chord(i);
    else reveal(i);
  }

  // --- Eingabe: Maus ---
  const cellIndex = e => {
    const el = e.target.closest('.cell');
    return el ? Number(el.dataset.i) : -1;
  };

  boardEl.addEventListener('contextmenu', e => e.preventDefault());

  boardEl.addEventListener('mousedown', e => {
    if (e.button === 1) e.preventDefault(); // kein Auto-Scroll beim Mittelklick
  });

  boardEl.addEventListener('mouseup', e => {
    if (Date.now() - lastTouch < 800) return; // von Touch erzeugte Maus-Events ignorieren
    const i = cellIndex(e);
    if (i < 0 || over) return;
    if (e.button === 0) handleOpen(i);
    else if (e.button === 1) { e.preventDefault(); if (cells[i].state === 'open') chord(i); }
    else if (e.button === 2) toggleFlag(i);
  });
  boardEl.addEventListener('auxclick', e => e.preventDefault());

  // --- Eingabe: Touch (lange drücken = Flagge) ---
  let pressTimer = null, longPressed = false, touchStartIdx = -1;
  boardEl.addEventListener('touchstart', e => {
    lastTouch = Date.now();
    const i = cellIndex(e);
    if (i < 0 || over) return;
    touchStartIdx = i;
    longPressed = false;
    pressTimer = setTimeout(() => {
      longPressed = true;
      toggleFlag(i);
      if (navigator.vibrate) navigator.vibrate(30);
    }, 400);
  }, { passive: true });
  boardEl.addEventListener('touchmove', () => { clearTimeout(pressTimer); touchStartIdx = -1; }, { passive: true });
  boardEl.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    lastTouch = Date.now();
    e.preventDefault(); // verhindert die nachfolgenden Maus-Events
    if (!longPressed && touchStartIdx >= 0) handleOpen(touchStartIdx);
    touchStartIdx = -1;
  });

  // --- Steuerung ---
  restartEl.addEventListener('click', () => newGame());

  const customPanel = document.getElementById('customPanel');
  document.querySelectorAll('.controls button.level').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.controls button.level').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const lvl = btn.dataset.level;
      if (lvl === 'custom') { customPanel.classList.add('show'); return; }
      customPanel.classList.remove('show');
      newGame(LEVELS[lvl]);
    });
  });

  document.getElementById('customStart').addEventListener('click', () => {
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const w = clamp(parseInt(document.getElementById('cw').value, 10) || 9, 5, 50);
    const h = clamp(parseInt(document.getElementById('ch').value, 10) || 9, 5, 30);
    const m = clamp(parseInt(document.getElementById('cm').value, 10) || 10, 1, w * h - 1);
    document.getElementById('cw').value = w;
    document.getElementById('ch').value = h;
    document.getElementById('cm').value = m;
    newGame({ w, h, m });
  });

  // F2 = neues Spiel
  document.addEventListener('keydown', e => { if (e.key === 'F2') { e.preventDefault(); newGame(); } });

  newGame(LEVELS.beginner);
})();
</script>
</body>
